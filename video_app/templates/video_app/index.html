{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrabX - Video Downloader</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="ress">
<div class="headd">
    <i class="fas fa-play-circle logo-icon"></i>
    <h1><b>GrabX</b></h1>
    <p>Download videos from any platform instantly</p>
</div>

<div class="cont">
    <b><h1><i class="fas fa-link me-2"></i>Enter Video URL</h1></b>
    <form id="fetchForm" method="get" action="{% url 'fetch_video' %}">
        <i class="fas fa-globe"></i>
        <input type="text" name="url" placeholder="Paste video URL" required>
        <button type="submit"><i class="fas fa-search me-2"></i>Fetch Video</button>
    </form>
</div>

</div>
<!-- Loading animation -->
<div id="loading" 
     style="
       display:none;
       width:50px;
       height:50px;
       border:6px solid #ccc;
       border-top:6px solid #007bff;
       border-radius:50%;
       margin:20px auto;
       animation: spin 1s linear infinite;
     ">
</div>

<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
    
    <p id="para">Fetching video, please wait...</p>
</div>

<!-- Video result -->
<div class="result">
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if video %}
    <img src="{{ video.thumbnail }}" alt="Thumbnail">
    <h3 class="video-title">{{ video.title }}</h3>
    <p>Duration: {{ video.duration }} seconds</p>
    <br>
    <a href="{% url 'download_video' %}?url={{ video.url|urlencode }}&title={{ video.title|urlencode }}" class="btn-download">
        Download Video
    </a>
    <button class="bttn" onclick="window.location.href='/'">Next</button>
  {% endif %}
</div>

<!-- JavaScript -->
<script>
const form = document.getElementById('fetchForm');
const hids = document.getElementById('ress');
const para = document.getElementById('para');
const loadingDiv = document.getElementById('loading');
const resultDiv = document.querySelector('.result');

form.addEventListener('submit', async function(e) {
    e.preventDefault(); // prevent page reload

    const urlInput = form.querySelector('input[name="url"]').value;
    if (!urlInput) return alert('Please enter a video URL');

    loadingDiv.style.display = 'block';
    resultDiv.style.display = 'none';

    try {
        const response = await fetch(`{% url 'fetch_video' %}?url=${encodeURIComponent(urlInput)}`, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await response.json();

        if (data.error) {
            resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
        } else {
            resultDiv.innerHTML = data.html;
        }
      
        hids.style.display = 'none';
        loadingDiv.style.display = 'none';
        resultDiv.style.display = 'block';
        para.style.display = 'none';


    } catch (err) {
        loadingDiv.style.display = 'none';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<p style="color:red">Error fetching video: ${err}</p>`;
    }
});
</script>
